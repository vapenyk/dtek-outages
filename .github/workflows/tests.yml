name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    name: unit (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest supported version. Python 3.9 prebuilt binaries only exist
          # for Ubuntu 22.04/24.04, not for ubuntu-latest (26.04).
          - { os: ubuntu-24.04, python: "3.9" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "system" }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        if: matrix.python != 'system'
        with:
          python-version: ${{ matrix.python }}

      - name: Show interpreter
        run: python3 -V

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t .

  package:
    name: build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
